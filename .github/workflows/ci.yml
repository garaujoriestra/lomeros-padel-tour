name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # npm install (no npm ci): el lock arrastra una inconsistencia preexistente en
      # una dep OPCIONAL wasm (@rolldown/binding-wasm32-wasi → @emnapi/core) que el
      # npm estricto de Node 24 rechaza en `npm ci`. `npm install` la reconcilia e
      # instala las opcionales que sí hacen falta (esbuild de vitest, etc.) — es lo
      # mismo que hace el build de Vercel, que despliega sin problema.
      - run: npm install --no-audit --no-fund

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run check:db-access

      - run: npm test
